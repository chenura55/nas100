<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>NasLog · NAS100 Journal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%237c3aed'/%3E%3Cpath d='M16 16V0A16 16 0 0 1 32 16Z' fill='%23e9e0ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--bg:#08080a;--card:#16161a;--card2:#212127;--line:#2b2b33;--text:#f4f4f6;--mute:#8e8e9a;--p:#7c3aed;--p2:#a78bfa;--lime:#c6f432;--red:#f0627a;--blue:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overflow-y:scroll}
body{margin:0;color:var(--text);font:15px/1.45 "DM Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(90% 45% at 0% 0%,#3c2a6b 0,transparent 65%),radial-gradient(60% 35% at 100% 0%,#173a4d66 0,transparent 65%),var(--bg) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.hi{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.hi.fire{color:#fb923c}.hi.ok{color:var(--lime)}.hi.no{color:var(--red)}.hi.gold{color:#fbbf24}.huge .hi{width:.78em;height:.78em;vertical-align:-.04em}.btn .hi{margin-right:6px}.pill .hi{width:1.3em;height:1.3em;vertical-align:-.3em}.tk i .hi{width:13px;height:13px}.gy-b .hi{width:60%;height:60%;vertical-align:middle}.empty .hi.big{width:46px;height:46px;vertical-align:baseline}
.wrap{max-width:1200px;margin:0 auto;padding:22px}

/* top bar + nav */
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-right:auto;letter-spacing:-.01em}
.logo i{width:32px;height:32px;border-radius:50%;background:conic-gradient(#e9e0ff 0 25%,var(--p) 0)}
.nav{display:flex;gap:6px;background:#ffffff0a;border:1px solid #ffffff0f;padding:4px;border-radius:999px}
.nav .pill{border:0;background:none;padding:8px 18px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;color:var(--mute);transition:.15s}
.pill:hover{color:var(--text)}
.pill.on{background:#fff;color:#000;border-color:#fff}
.pill.sm{padding:6px 14px;font-size:13px}
.btn{background:#fff;color:#000;border:0;border-radius:999px;padding:10px 20px;font-weight:600;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,#8b4dff,#6d28d9);color:#fff;box-shadow:0 6px 20px #7c3aed55}
.btn.g{background:var(--card2);color:var(--text)}
.outb{display:flex;align-items:center;gap:8px}.outb svg{width:18px;height:18px}

/* type + cards */
h1{font-size:38px;font-weight:600;margin:0 0 4px;letter-spacing:-.025em;line-height:1.1}h1 span{color:var(--mute)}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:linear-gradient(180deg,#1a1a20,#141418);border:1px solid #ffffff0d;border-radius:24px;padding:20px}
.lbl{color:var(--mute);font-size:13px}
.big{font-size:28px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.up{color:var(--lime)}.dn{color:var(--red)}
.ct{font-size:14px;color:var(--mute);margin-bottom:12px;font-weight:500}
.grid{display:grid;gap:16px}
.two{grid-template-columns:2fr 1fr}
.empty{color:var(--mute);text-align:center;padding:36px 0}.empty.sm{padding:18px 0;font-size:14px}
.err{color:var(--red);min-height:20px;font-size:13px}
.x{background:none;border:0;color:var(--mute);padding:4px 6px}.x:hover{color:var(--text)}.x.dng{color:var(--red);font-weight:600}.x.ok{color:var(--lime)}
.tag{border-radius:999px;padding:3px 11px;font-size:12px;background:var(--card2)}
.tag.BUY,.tag.TP{color:var(--lime)}.tag.SELL,.tag.SL{color:var(--red)}.tag.BE{color:var(--blue)}
.bar{display:flex;height:10px;border-radius:9px;overflow:hidden;margin:12px 0;background:var(--card2)}.bar.slim{height:7px;margin:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* dashboard */
.dash{display:grid;gap:16px;grid-template-columns:2fr 1fr;margin-bottom:16px}
.hero{background:linear-gradient(135deg,#6a35e6 0%,#3a2282 52%,#18181d 100%);border:1px solid #ffffff1a;padding:24px;overflow:hidden;position:relative}
.hero .lbl{color:#ffffffb3}
.hero h1{font-size:32px;margin:2px 0}
.hero-main{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:end;margin-top:18px}
.huge{font-size:58px;font-weight:700;letter-spacing:-.035em;line-height:1}
.chip{display:inline-flex;gap:6px;align-items:center;background:#ffffff1c;border-radius:999px;padding:5px 12px;font-size:13px;backdrop-filter:blur(6px)}
.hchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rng{display:flex;gap:4px;background:#00000040;border-radius:999px;padding:3px}.rng button{border:0;background:none;color:#ffffffaa;padding:5px 12px;border-radius:999px;font-size:13px}.rng button.on{background:#fff;color:#000;font-weight:600}
.spark{min-width:0}
.pmc{display:flex;flex-direction:column}
.pmr{display:flex;align-items:center;gap:16px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;padding:16px 18px}
.kpi:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--a,var(--p))}
.kpi .big{font-size:26px}.kpi .lbl:last-child{margin-top:2px;font-size:12px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.kv div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.kv div span:first-child{color:var(--mute)}.kv div b{font-weight:500;text-align:right}
.rt{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.rt:first-of-type{border-top:0}.rt .m{flex:1;min-width:0}.rt .m small{display:block;color:var(--mute);font-size:12px}
.bkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:16px}
.brow{display:grid;grid-template-columns:minmax(70px,1fr) 34px minmax(40px,80px) 40px 58px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brow .bp{text-align:right}.brow b:nth-child(4){text-align:right}

/* journal */
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mute);font-weight:400;text-align:left;padding:10px 8px;white-space:nowrap}
td{padding:12px 8px;border-top:1px solid var(--line);white-space:nowrap}
.scroll{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input,.f input,.f select,.f textarea,.add-row input,.dt,.auth input{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;outline:none}
.filters select,.filters input{width:auto}
.f input:focus,.f select:focus,.f textarea:focus,.add-row input:focus,.auth input:focus{border-color:var(--p2)}
.mc{display:none}.mcard{padding:16px}.mcard .r1{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:6px}
.mcard .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;font-size:14px}.mcard .lbl{font-size:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:6px}.cal .h{color:var(--mute);font-size:12px;text-align:center}
.cd{background:var(--card2);border-radius:14px;min-height:82px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;min-width:0}
.cd.blank{background:none}.cd.win{background:#c6f43226;color:var(--lime)}.cd.loss{background:#f0627a26;color:var(--red)}.cd.be{background:#38bdf826;color:var(--blue)}.cd[data-day]{cursor:pointer}
.cd .dnum{color:var(--mute);font-size:12px}.cd b{font-size:15px}.cd small{color:var(--mute);font-size:11px}.cd.wk{background:var(--bg)}

/* forms (inside popups) */
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.f label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}.f .full{grid-column:1/-1}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card2)}
.seg button.on[data-v=BUY],.seg button.on[data-v=TP]{background:var(--lime);color:#000}.seg button.on[data-v=SELL],.seg button.on[data-v=SL]{background:var(--red);color:#000}.seg button.on[data-v=BE]{background:var(--blue);color:#000}
.live{background:var(--card2);border-radius:16px;padding:12px;display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:10px}
.chk{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--p);flex:none;margin:0}.chk span{flex:1;word-break:break-word}.chk.done span{color:var(--mute);text-decoration:line-through}.chk .x{font-size:16px;padding:6px 8px}
.chk .re{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.add-row{display:flex;gap:8px;margin:14px 0 8px}.add-row input{flex:1;min-width:0}
.score{text-align:center;margin:10px 0 14px}.score b{font-size:52px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips .pill{padding:7px 14px;font-size:13px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.hist .bar{flex:1;min-width:80px;margin:0}
.mini{display:flex;align-items:flex-end;height:90px}.mini>div{flex:1;border-radius:6px;min-height:4px}
.rate{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}.rate span:first-child{flex:1;min-width:0;word-break:break-word}.rate .bar{width:70px;margin:0;flex:none}.hnote{flex-basis:100%;color:var(--mute);font-size:13px;margin-top:-4px}

/* confluence */
.tfh{display:flex;align-items:center;gap:10px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;margin-bottom:8px;font-size:15px}
.tfh b{flex:1;font-weight:600}.tfh .n{background:var(--p);color:#fff;border-radius:999px;font-size:12px;padding:2px 10px}.tfh.open{border-color:var(--p2)}
.cchips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 14px}
.cc{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--text);transition:.15s}
.cc.on{background:var(--p);border-color:var(--p2);color:#fff;font-weight:600}
.cc.sm{padding:7px 14px;font-size:13px}.cc.tfa{font-weight:600;border-color:#ffffff22}
.cfr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.cfr:first-of-type{border-top:0}.cfr .cc.tfa{min-width:64px}
.seg.m{width:150px}.seg.m button.on,.seg.ty button.on{background:#fff;color:#000}
.tfl{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}.tfl .tag b{color:var(--p2);font-weight:600;margin-right:4px}
/* tick chips */
.tk{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;font-size:14px;transition:.15s}
.tk i{width:20px;height:20px;border-radius:6px;border:1.5px solid #5a5a66;display:grid;place-items:center;font-style:normal;font-size:13px;color:transparent;flex:none}
.tk.on{border-color:var(--p2)}.tk.on i{background:var(--p);border-color:var(--p2);color:#fff}
.tks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;margin-bottom:10px}.sec>.lbl:first-child{font-weight:600;color:var(--text)}
.sub2{margin-left:12px;padding-left:12px;border-left:2px solid var(--p);display:grid;gap:8px}
.arow{display:grid;grid-template-columns:minmax(70px,1fr) 34px 46px 58px 58px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.arow>*{text-align:right;min-width:0}.arow>:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow.h{border-top:0;color:var(--mute);font-size:11px}
.ins{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.ins:first-of-type{border-top:0}
/* auth */
.auth{max-width:400px;margin:12vh auto;padding:28px}.auth input{margin:6px 0;padding:13px}

/* mobile bottom tab bar */
.tabbar{display:none}
.addbtn{order:5}

/* SweetAlert2 theme */
.swal2-container{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nl-pop{border-radius:26px!important;border:1px solid #ffffff14!important;font-family:"DM Sans",system-ui,sans-serif!important;box-shadow:0 24px 70px #000b!important;background:linear-gradient(180deg,#1b1b21,#141418)!important}
.nl-pop .swal2-title{font-weight:600!important;font-size:22px!important;color:var(--text)!important}
.nl-pop .swal2-html-container{color:var(--mute)!important}
.nl-ok,.nl-cancel{border-radius:999px!important;padding:11px 24px!important;font-weight:600!important;box-shadow:none!important;border:0!important;font-size:15px!important}
.nl-cancel{background:var(--card2)!important;color:var(--text)!important}.nl-ok{background:linear-gradient(135deg,#8b4dff,#6d28d9)!important;color:#fff!important}.nl-ok.danger{background:var(--red)!important;color:#000!important}
.nl-pop .swal2-input{background:var(--card2)!important;border:1px solid var(--line)!important;border-radius:14px!important;color:var(--text)!important;box-shadow:none!important;font-size:16px!important}
.nl-toast{border-radius:16px!important;border:1px solid var(--line)!important}
.nl-form{width:min(700px,calc(100vw - 24px))!important;max-height:calc(100dvh - 24px);overflow-y:auto!important;padding:22px 22px 0!important;text-align:left}
.nl-form .swal2-title{text-align:left!important;padding:0!important;margin:0!important;justify-content:flex-start!important;font-size:24px!important}
.nl-form .nl-html{margin:16px 0 0!important;padding:0!important;text-align:left!important;overflow:visible!important;font-size:15px!important}
.nl-form .swal2-actions{position:sticky;bottom:0;z-index:5;background:#161619;margin:18px -22px 0!important;padding:14px 22px calc(14px + env(safe-area-inset-bottom))!important;border-top:1px solid var(--line);width:auto!important;justify-content:flex-end!important}
.nl-form .swal2-validation-message{background:#f0627a22!important;color:var(--red)!important;margin:14px 0 0!important}
.nl-form .nl-close{color:var(--mute)!important;font-size:34px!important;top:8px;right:8px}
.nl-up{animation:nlup .32s cubic-bezier(.2,.9,.3,1)}.nl-down{animation:nldown .22s ease forwards}
@keyframes nlup{from{transform:translateY(100%)}to{transform:none}}@keyframes nldown{to{transform:translateY(100%)}}

/* ---------- shared touch / input fixes ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.pill,.tk,.cc,.chk{touch-action:manipulation}
input[type=date],input[type=time]{min-height:46px;min-width:0;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.kv div span:first-child{min-width:0}.mcard{overflow-wrap:anywhere}.ins span{min-width:0;overflow-wrap:anywhere}
.chips .lbl{flex:none;white-space:nowrap}
/* ---------- tablet ---------- */
@media(max-width:1000px){
  .nav .pill{padding:8px 13px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .dash,.two{grid-template-columns:1fr}
}
/* ---------- mobile ---------- */
@media(max-width:700px){
  .wrap{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
  .top{margin-bottom:18px;gap:10px}.nav{display:none}.outb span{display:none}.outb{padding:9px 11px}
  h1{font-size:28px}.sub{margin-bottom:16px}
  .card{padding:16px;border-radius:20px}
  .big{font-size:22px;word-break:break-word}
  .hero{padding:18px}.hero h1{font-size:26px}.hero-main{grid-template-columns:1fr;gap:12px}.huge{font-size:46px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px 14px 14px 16px}.kpi .big{font-size:21px}.kpi.wide{grid-column:1/-1}
  .kv{grid-template-columns:1fr}
  .brow{grid-template-columns:minmax(60px,1fr) 30px 56px 38px 54px;gap:6px;font-size:13px}
  .tbl{display:none}.mc{display:grid;gap:10px}
  .filters{display:grid;grid-template-columns:1fr 1fr}.filters select,.filters input{width:100%}
  input,select,textarea{font-size:16px!important}
  .cal{grid-template-columns:repeat(7,1fr);gap:4px}.cal .wk{display:none}.cd{min-height:58px;padding:5px;border-radius:10px}.cd b{font-size:11px}.cd small{display:none}.card .cal{margin:-6px}
  .nomob{display:none!important}
  .addbtn{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:15;padding:14px 22px;box-shadow:0 8px 28px #7c3aedcc}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#101013ee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mute);font-size:11px;font-weight:500;padding:7px 0;border-radius:14px;transition:.15s}
  .tabbar button.on{color:#fff;background:#ffffff12}.tabbar button.on svg{color:var(--p2)}
  .f{grid-template-columns:1fr}.live>div{min-width:30%}
  .auth{margin:6vh auto;padding:22px}
  .ph{gap:10px}.ph>div[style*="flex"]{width:100%}.ph>div[style*="flex"] .btn{flex:1}
  .ph>.btn{width:100%}
  .x{padding:9px 11px}
  .hist{gap:6px 12px}.hist .bar{flex:1 1 100%;order:10}.hist .hnote{order:11}
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-2px}.chips::-webkit-scrollbar{display:none}.chips .pill{white-space:nowrap;flex:none}
  .cfr{gap:6px}.cc.sm{padding:8px 13px}.tks{grid-template-columns:1fr}
  .seg.m{width:100%}
  .filters .pill{padding:10px 14px}
  .rate .bar{width:56px}
  .score b{font-size:44px}
  .nl-form{width:100%!important;max-width:none!important;margin:0!important;border-radius:26px 26px 0 0!important;max-height:92dvh;padding:18px 16px 0!important}
  .nl-form .swal2-actions{margin:16px -16px 0!important;padding:12px 16px calc(12px + env(safe-area-inset-bottom))!important}
  .nl-form .swal2-actions button{flex:1}
  .swal2-container.swal2-bottom{padding:0!important}
  .kv.cmp{grid-template-columns:1fr 1fr;gap:0 16px}.kv.cmp div{flex-direction:column;gap:2px;padding:9px 0}.kv.cmp div b{text-align:left;font-size:16px}
  .filters{gap:8px}.filters select,.filters input{min-width:0;min-height:46px}.filters .pill{display:flex;align-items:center;justify-content:center;min-height:46px}#clearF{grid-column:1/-1}
  .chips{margin-right:-14px;padding-right:14px}.chips .pill.sm{padding:9px 15px}
  .arow{grid-template-columns:minmax(64px,1fr) 30px 40px 52px 52px;gap:4px;font-size:12px}
  .tk{padding:13px 14px;min-height:48px}.sub2{margin-left:6px;padding-left:10px}.cc.sm,.cc{min-height:40px}
  .live{gap:12px 6px}.live>div{flex:1 1 30%}
  .mcard .r1{flex-wrap:wrap;gap:6px}.mcard .g2{gap:12px 10px}
  .kpi .lbl:last-child{overflow-wrap:anywhere}

function calView() {
  const { y, m } = S.cal, days = new Date(y, m + 1, 0).getDate(), off = (new Date(y, m, 1).getDay() + 6) % 7, pre = `${y}-${String(m + 1).padStart(2, "0")}`;
  const by = {}; fwd().forEach((t) => { if (t.trade_date.startsWith(pre)) { const o = (by[t.trade_date] = by[t.trade_date] || { p: 0, n: 0 }); o.p += rv(t); o.n++; } });
  const vals = Object.values(by), tot = vals.reduce((a, o) => a + o.p, 0), cnt = vals.reduce((a, o) => a + o.n, 0), gd = vals.filter((o) => o.p > 0).length, rd = vals.filter((o) => o.p < 0).length;
  const arr = Array(off).fill(null); for (let d = 1; d <= days; d++) arr.push({ d, key: `${pre}-${String(d).padStart(2, "0")}` }); while (arr.length % 7) arr.push(null);
  let grid = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "Week"].map((h) => `<div class="h ${h === "Week" ? "wk" : ""}">${h}</div>`).join("");
  for (let w = 0; w < arr.length; w += 7) {
    const wk = arr.slice(w, w + 7); let wp = 0, wn = 0;
    grid += wk.map((c) => { if (!c) return `<div class="cd blank"></div>`; const x = by[c.key]; if (x) { wp += x.p; wn += x.n; }
      return `<div class="cd ${x ? (x.p > 0 ? "win" : x.p < 0 ? "loss" : "be") : ""}" ${x ? `data-day="${c.key}"` : ""}><span class="dnum">${c.d}</span>${x ? `<b>${rs(x.p)}</b><small>${x.n} trade${x.n > 1 ? "s" : ""}</small>` : ""}</div>`; }).join("");
    grid += `<div class="cd wk"><span class="dnum">Week ${w / 7 + 1}</span>${wn ? `<b class="${cls(wp)}">${rs(wp)}</b><small>${wn} trade${wn > 1 ? "s" : ""}</small>` : ""}</div>`;
  }
  const name = new Date(y, m, 1).toLocaleString("en", { month: "long", year: "numeric" });
  return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><button class="pill" id="cp">${ico("chevron-left")}</button><h1 style="margin:0;font-size:28px;flex:1;text-align:center">${name}</h1><button class="pill" id="cn">${ico("chevron-right")}</button></div>
  <p class="sub" style="text-align:center">Total <b class="${cls(tot)}">${rs(tot)}</b> · ${cnt} trades · ${gd} green · ${rd} red. Tap a day to open its trades.</p><div class="card"><div class="cal">${grid}</div></div>`;
}

// Entry pattern, market context, invalidation and SL reason. All tick based, state lives in S.xs
function xbody() {
  const X = S.xs, tk = (k, l, on) => `<button type="button" class="tk ${on ? "on" : ""}" data-x="${k}"><i>${ico("check")}</i>${esc(l)}</button>`, two = (k, a, cur) => `<div class="tks">${a.map((c) => tk(k + "|" + c, c, cur === c)).join("")}</div>`;
  $("#xb").innerHTML = `<div class="sec"><div class="lbl">Entry pattern</div>${two("pat", PATTERNS, X.pat)}</div>
  <div class="sec"><div class="lbl">Market context</div>${tk("ath", "Market at all-time high (ATH)", X.ath)}${tk("ib", "Inside bar present", X.ib)}
    ${X.ib ? `<div class="sub2"><div class="lbl">Inside bar timeframe</div>${two("ibtf", ["1D", "1H", "15min"], X.ibtf)}<div class="lbl">Does it support the bias?</div><div class="tks">${tk("ibb|Yes", "Supports bias", X.ibb === "Yes")}${tk("ibb|No", "Doesn't support bias", X.ibb === "No")}</div></div>` : ""}
    ${tk("inv", "Invalidation", X.inv)}${X.inv ? `<div class="sub2"><div class="tks">${["I.SMT", "SMT"].map((c) => tk("it|" + c, c, X.it.has(c))).join("")}</div></div>` : ""}</div>
  ${X.o === "SL" ? `<div class="sec"><div class="lbl">Stop loss reason</div>${tk("ret", "Retracement came after my entry", X.ret)}${X.ret ? `<div class="sub2"><div class="lbl">PD array that caused the SL</div>${two("pd", PD, X.pd)}</div>` : ""}</div>` : ""}`;
  document.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => {
    const i = b.dataset.x.indexOf("|"), k = i < 0 ? b.dataset.x : b.dataset.x.slice(0, i), c = i < 0 ? "" : b.dataset.x.slice(i + 1);
    if (k === "it") X.it.has(c) ? X.it.delete(c) : X.it.add(c); else if (["pat", "ibtf", "ibb", "pd"].includes(k)) X[k] = X[k] === c ? "" : c; else X[k] = !X[k];
    xbody();
  }));
}

  S.cfm = { open: null, data: Object.fromEntries(TFS.map((tf) => [tf, new Set(t?.confluences?.[tf] || [])])) };
  const res = await Swal.fire({
    ...pop("nl-form"), title: t ? "Edit trade" : "New trade", html: formHtml(), confirmButtonText: "Save trade",
    didOpen: () => {

/* Engine: pure functions. Everything is calculated from the habits + check-ins saved in the database. */
const gD = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const gS = (t) => new Date(t).toISOString().slice(0, 10);
const gAdd = (s, n) => gS(gD(s) + n * 864e5);
const gDiff = (a, b) => Math.round((gD(a) - gD(b)) / 864e5);

const gMon = (s) => gAdd(s, -((gDow(s) + 6) % 7));
const gM1 = (s) => s.slice(0, 7) + "-01";
const gMEnd = (m) => gS(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0));
const gNextM = (m1) => gS(Date.UTC(+m1.slice(0, 4), +m1.slice(5, 7), 1));
const gyDay = (h) => ["daily", "weekdays", "interval"].includes(h.sched_type);

// Is the habit scheduled (or available, for weekly habits) on this date?
function gySched(h, d, x) {
  if (d < h.start_date || (h.end_date && d > h.end_date)) return false;
  const s = h.sched || {}, w = gDow(d);
  if (h.sched_type === "weekdays" || h.sched_type === "custom_week") return (s.days || []).includes(w);
  if (h.sched_type === "interval") return !!(x && x.IV && x.IV[h.id] && x.IV[h.id].dues.has(d)); // due dates follow your ticks (see gyIvInfo)
  return true; // daily, weekly_count
}
// Repeat-interval habits (weight, waist, any "every N days" habit): the first entry unlocks on the first due date,
// then every next entry unlocks N days AFTER the day you actually ticked. Until then the boxes stay locked.
// dues = due dates used for streaks. open = the day the next entry unlocks.
function gyIvInfo(h, C, t) {

  let open = h.start_date; // the very first entry unlocks on the start date

    if (!f) break;
    open = gAdd(f, every);

  for (let d = gAdd(open, every), n = 0; n < 60; d = gAdd(d, every), n++) if (d > t) dues.add(d); // future due dates, so weeks/months stay "in progress"
  return { dues, open };
}
// Can this date be ticked? Yes if it already has an entry (edit/clear), otherwise only when at least N days have passed since the previous entry (and N days remain before the next one).
function gyCanTick(h, d, x) {

}
// Context: check-ins indexed by habit/date. Only "done" check-ins exist: a day that is not ticked is a miss.
function gyCtx(H, K, t) {

  const IV = {}; H.forEach((h) => { if (h.sched_type === "interval") IV[h.id] = gyIvInfo(h, C[h.id] || {}, t); });

}
// Outcome of one scheduled day for a daily-type habit: done | fail | pending | null (not scheduled)
function gyOut(h, d, x) {
  if (!gySched(h, d, x)) return null;
  if (x.C[h.id]?.[d]) return "done";
  return d >= x.today ? "pending" : "fail";
}
// Outcome of one Mon-Sun week for a weekly habit
function gyWeek(h, mon, x) {

}
// Per habit: current streak, longest streak, completion %
function gyHabitStats(h, x) {

      else if (w.status === "fail") { r.cur = 0; r.fail++; r.cd += Math.min(w.done, w.need); r.ce += w.need; }

function gyOverall(x) {

}

function gyDayTally(from, to, x) {

}
// Everything in a date range. weekly habits count in a range when the Thursday of their week is inside it.
function gyRange(from, to, x, weekly = true) {

  x.H.forEach((h) => {
    if (gyDay(h)) {

        else r.pend++;
      }
    }

// Badges: Week Warrior = a full week, Monthly Master = a full calendar month, Annual Legend = 12 complete months in a row
function gyBadges(x) {

  const wk = gyRange(mon, gAdd(mon, 6), x), mo = gyRange(gM1(t), gMEnd(t.slice(0, 7)), x), all = first <= t ? gyRange(first, t, x) : { pct: null };
  const ring = (r, lab) => { const tot = r.done + r.pend + r.fail, p = tot ? r.done / tot : 0; return `<div style="text-align:center">${donut([{ v: p, c: r.fail ? "#f0627a" : "#c6f432" }], Math.round(p * 100) + "%", "", 96)}<div class="lbl" style="color:#ffffffb3;margin-top:2px">${lab}</div></div>`; };
  return `<div class="card hero gy-hero"><div><div class="lbl">Current streak</div><div class="huge" style="margin-top:4px">${ico("fire", "fire")} ${ov.cur}<span style="font-size:20px;font-weight:500;opacity:.8"> day${ov.cur === 1 ? "" : "s"}</span></div>
    <div class="hchips"><span class="chip">Longest ${ov.best}</span><span class="chip">Perfect days ${ov.days}</span><span class="chip">Missed days ${ov.miss}</span><span class="chip">Consistency ${gyPct(all.pct)}</span></div></div>
    <div class="gy-rings">${ring(wk, "This week")}${ring(mo, "This month")}</div></div>`;
}

const gyBars = (items) => `<div class="gy-bars">${items.map((i) => `<div class="gy-bc"><div class="gy-bt">${i.v == null ? "" : Math.round(i.v)}</div><div class="gy-bw"><div class="gy-bf" style="height:${i.v == null ? 0 : Math.max(i.v, 3)}%;background:${i.v == null ? "transparent" : scCol(i.v)}"></div></div><div class="gy-bl">${i.l}</div></div>`).join("")}</div>`;

function gyHeat(x) {
  const t = x.today, mon = gMon(t); let cells = "";
  for (let d = gAdd(mon, -7 * 25); d <= gAdd(mon, 6); d = gAdd(d, 1)) {
    if (d > t) { cells += "<i></i>"; continue; }
    const outs = x.H.filter(gyDay).map((h) => gyOut(h, d, x)).filter(Boolean), l = !outs.length ? "" : outs.includes("fail") ? "l1" : outs.includes("pending") ? "l3" : "l4";
    cells += `<i class="${l}" title="${d}: ${!outs.length ? "nothing scheduled" : l === "l1" ? "missed day" : l === "l3" ? "in progress" : "perfect day"}"></i>`;
  }
  return `<div class="gy-hwrap"><div class="gy-heat">${cells}</div></div><div class="lbl" style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">Last 26 weeks (Mon–Sun) <span class="gy-lg"><i style="background:#f0627a66"></i>Missed day</span><span class="gy-lg"><i style="background:#38bdf8cc"></i>In progress</span><span class="gy-lg"><i style="background:var(--lime)"></i>Perfect day</span></div>`;
}

function gyLine(pts, unit) {
  if (pts.length < 2) return "";
  const vs = pts.map((p) => p.v), mn = Math.min(...vs), mx = Math.max(...vs), r = mx - mn || 1, W = 300, H = 70;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${((i / (pts.length - 1)) * W).toFixed(1)},${(H - 8 - ((p.v - mn) / r) * (H - 16)).toFixed(1)}`).join(" ");
  const ch = vs[vs.length - 1] - vs[0];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="70" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#a78bfa" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg><div class="lbl">${gyNum(vs[0])} → <b style="color:var(--text)">${gyNum(vs[vs.length - 1])} ${esc(unit || "")}</b> (${ch > 0 ? "+" : ""}${gyNum(ch)}) · ${pts.length} records</div>`;
}

// Compares trading results on days when every daily habit was done vs days with a miss
function gyTradeLink(x, L, margin) {
  const by = {}; L.forEach((t) => (by[t.trade_date] = by[t.trade_date] || []).push(t));
  const hi = [], lo = [];
  Object.keys(by).forEach((d) => { if (d >= today()) return; const r = gyRange(d, d, x, false); if (!r.ce) return; (r.fail === 0 && r.done > 0 ? hi : lo).push(d); });
  const g = (days) => { const tr = days.flatMap((d) => by[d]), p = tr.reduce((a, t) => a + rv(t), 0); return { d: days.length, avg: days.length ? p / days.length : null, win: tr.length ? (tr.filter((t) => t.outcome === "TP").length / tr.length) * 100 : null }; };
  const A = g(hi), B = g(lo);
  if (!A.d && !B.d) return "";
  const c = (title, o) => `<div class="card"><div class="lbl">${title}</div><div class="big ${o.avg != null ? cls(o.avg) : ""}">${o.avg != null ? rs(o.avg) + " / day" : "-"}</div><p class="lbl" style="margin:8px 0 0">${o.d} traded day${o.d === 1 ? "" : "s"} · win rate ${o.win != null ? o.win.toFixed(0) + "%" : "-"}</p></div>`;
  return `<div class="bkg" style="margin:${margin}"><div class="lbl" style="grid-column:1/-1;margin-bottom:-6px">Do your habits affect your trading? (days with daily habits and trades)</div>${c("All habits done days", A)}${c("Missed a habit days", B)}</div>`;
}

function gyInsights(x) {
  const t = x.today, mon = gMon(t), first = x.H.reduce((a, h) => (h.start_date < a ? h.start_date : a), "9999-99-99");
  const td = gyRange(t, t, x, false), wk = gyRange(mon, gAdd(mon, 6), x), mo = gyRange(gM1(t), gMEnd(t.slice(0, 7)), x), all = first <= t ? gyRange(first, t, x) : { pct: null }, ov = gyOverall(x);
  const months = []; if (first <= t) for (let m = gM1(first); m <= t; m = gNextM(m)) months.push({ m, r: gyRange(m, gMEnd(m), x), dt: gyDayTally(m, gMEnd(m) < t ? gMEnd(m) : t, x) });
  const best = months.filter((o) => o.r.ce).sort((a, b) => b.r.pct - a.r.pct || b.r.ce - a.r.ce)[0];
  const kp = (a, b, c, col) => `<div class="card kpi" style="--a:${col}"><div class="lbl">${a}</div><div class="big">${b}</div><div class="lbl">${c}</div></div>`;
  const wb = [], mb = [];
  for (let i = 11; i >= 0; i--) { const m = gAdd(mon, -7 * i); wb.push({ l: m.slice(5).replace("-", "/"), v: gyRange(m, gAdd(m, 6), x).pct }); }
  for (let i = 11; i >= 0; i--) { const d = new Date(Date.UTC(+t.slice(0, 4), +t.slice(5, 7) - 1 - i, 1)), m1 = gS(d); mb.push({ l: d.toLocaleDateString("en", { month: "short", timeZone: "UTC" }), v: gyRange(m1, gMEnd(m1), x).pct }); }
  const perf = x.H.map((h) => { const r = gyHabitStats(h, x); return `<div class="gy-hp"><div><b>${esc(h.name)}</b><div class="lbl">${esc(gyShort(h))}</div></div><div class="bar slim"><span style="width:${r.pct || 0}%;background:${scCol(r.pct || 0)}"></span></div><b style="text-align:right">${gyPct(r.pct)}</b>
    <div class="st"><span>${ico("fire", "fire")} ${r.cur} ${r.unit}${r.cur === 1 ? "" : "s"}</span><span>Longest ${r.best}</span><span>Done ${r.cd}/${r.ce}</span><span>Missed ${r.fail}</span></div></div>`; }).join("");
  const hist = [...months].reverse().map(({ m, r, dt }) => `<div class="gy-hp" style="grid-template-columns:110px 1fr 48px"><b>${new Date(m + "T12:00:00Z").toLocaleDateString("en", { month: "short", year: "numeric", timeZone: "UTC" })}${r.complete ? " " + ico("trophy", "gold") : ""}</b><div class="bar slim"><span style="width:${r.pct || 0}%;background:${scCol(r.pct || 0)}"></span></div><b style="text-align:right">${gyPct(r.pct)}</b><div class="st"><span>Perfect days ${dt.perfect}</span><span>Missed days ${dt.miss}</span><span>Done ${r.cd}/${r.ce}</span></div></div>`).join("");
  const trend = x.H.filter((h) => h.kind === "value").map((h) => ({ h, pts: S.checkins.filter((c) => c.habit_id === h.id && c.status === "done" && c.value != null).sort((a, b) => (a.check_date < b.check_date ? -1 : 1)).map((c) => ({ d: c.check_date, v: +c.value })) })).filter((o) => o.pts.length >= 2);
  return `<div class="kpis">${kp("Today", gyPct(td.pct), `${td.cd}/${td.ce} done`, "var(--lime)")}${kp("This week", gyPct(wk.pct), `${wk.cd}/${wk.ce} done`, "var(--blue)")}${kp("This month", gyPct(mo.pct), `${mo.cd}/${mo.ce} done`, "var(--p2)")}${kp("All time", gyPct(all.pct), `${all.cd || 0}/${all.ce || 0} done`, "var(--lime)")}${kp("Missed days", ov.miss, "any habit not ticked", "var(--red)")}
    ${kp("Current streak", ov.cur + " <span class='lbl'>days</span>", "perfect days in a row", "var(--p2)")}${kp("Longest streak", ov.best + " <span class='lbl'>days</span>", `${ov.days} perfect days total`, "var(--p2)")}${kp("Best month", best ? gyPct(best.r.pct) : "–", best ? gyMonthName(best.m.slice(0, 7)) : "no data yet", "var(--lime)")}</div>
  ${gyTradeLink(x, fwd(), "0 0 16px")}
  <div class="card" style="margin-bottom:16px"><div class="ct">Calendar heatmap</div>${gyHeat(x)}</div>
  <div class="grid two" style="grid-template-columns:1fr 1fr;margin-bottom:16px"><div class="card"><div class="ct">Weekly completion (last 12 weeks, week start)</div>${gyBars(wb)}</div><div class="card"><div class="ct">Monthly progress (last 12 months)</div>${gyBars(mb)}</div></div>
  <div class="card" style="margin-bottom:16px"><div class="ct">Habit-by-habit performance</div>${perf || `<div class="empty sm">No habits yet</div>`}</div>
  ${trend.length ? `<div class="bkg" style="margin:0 0 16px">${trend.map((o) => `<div class="card"><div class="ct">${esc(o.h.name)} trend</div>${gyLine(o.pts, o.h.unit)}</div>`).join("")}</div>` : ""}
  <div class="card"><div class="ct">Historical performance</div>${hist || `<div class="empty sm">No history yet</div>`}</div>`;
}

function gyBadgesView(x) {
  const B = gyBadges(x), t = x.today, mon = gMon(t), wk = gyRange(mon, gAdd(mon, 6), x), mo = gyRange(gM1(t), gMEnd(t.slice(0, 7)), x);
  const cnt = { week: B.week.length, month: B.month.length, year: B.year.length };
  const prog = { week: `${wk.done}/${wk.done + wk.pend + wk.fail} done this week${wk.fail ? " · missed, next week is a fresh start" : ""}`, month: `${mo.done}/${mo.done + mo.pend + mo.fail} done this month${mo.fail ? " · missed, try next month" : ""}`, year: `${B.run}/12 months in a row` };
  const pp = { week: wk, month: mo };
  const cards = GBADGE.map((b) => { const p = b.k === "year" ? (B.run / 12) * 100 : (pp[b.k].done + pp[b.k].pend + pp[b.k].fail ? (pp[b.k].done / (pp[b.k].done + pp[b.k].pend + pp[b.k].fail)) * 100 : 0);
    return `<div class="card gy-bg">${gyMedal(b.tier, b.glyph, !cnt[b.k])}<div><h3>${b.name}</h3><div class="n">${cnt[b.k] ? `Earned ×${cnt[b.k]}` : "Not earned yet"}</div><div class="lbl" style="margin:6px 0">${b.desc}</div><div class="bar slim" style="margin:8px 0"><span style="width:${p}%;background:var(--p2)"></span></div><div class="lbl">${prog[b.k]}</div></div></div>`; }).join("");
  const earned = GBADGE.flatMap((b) => B[b.k].map((e) => ({ ...b, ...e }))).sort((a, b) => (a.to < b.to ? 1 : -1)).slice(0, 40);
  const lab = (e) => e.k === "week" ? `Week of ${e.from}` : e.k === "month" ? gyMonthName(e.from.slice(0, 7)) : `${gyMonthName(e.from.slice(0, 7))} → ${gyMonthName(e.to.slice(0, 7))}`;
  return `<div class="gy-bgs">${cards}</div><div class="card"><div class="ct">Earned badges</div>${earned.map((e) => `<div class="gy-er">${gyMedal(e.tier, e.glyph, false, 34)}<div style="flex:1"><b>${e.name}</b><div class="lbl">${lab(e)}</div></div><span class="lbl">${e.to > t ? t : e.to}</span></div>`).join("") || `<div class="empty sm">${ico("trophy", "gold")} Finish a full week of your habits to earn your first badge</div>`}</div>
  <p class="lbl" style="margin:12px 2px">Rules: a week or month counts only when every scheduled habit is ticked. Any missed habit makes that day a missed day and resets the streak to 0.</p>`;
}

function gyHabitsTab(x) {
  const t = x.today, row = (h) => { const r = gyHabitStats(h, x), status = h.end_date && h.end_date < t ? `Ended ${h.end_date}` : h.start_date > t ? `Starts ${h.start_date}` : "Active";

const gyReload = async () => { const [h, k] = await Promise.all([api("/api/habits"), api("/api/checkins")]); S.habits = h; S.checkins = k.filter((c) => c.status === "done"); };

async function gyCelebrate(list) {
  if (!window.Swal || !list.length) return;
  const b = list[list.length - 1];
  await Swal.fire({ ...SW, customClass: { popup: "nl-pop", confirmButton: "nl-ok" }, showCancelButton: false, confirmButtonText: "Keep going", timer: 9000, timerProgressBar: true,
    html: `<div style="text-align:center">${gyMedal(b.tier, b.glyph, false, 120)}<h2 style="margin:6px 0 4px;color:var(--text)">${b.name} unlocked!</h2><p style="margin:0">${b.desc}. Amazing consistency!</p></div>` });
}

async function gySet(h, d, status, value) {
  const before = gyBadgeTotals();
  try { await api("/api/checkins", "PUT", { habit_id: h.id, date: d, status: status || "", value: value ?? null }); } catch (e) { return toast(e.message, "error"); }
  const i = S.checkins.findIndex((c) => c.habit_id === h.id && c.check_date === d);
  if (i >= 0) S.checkins.splice(i, 1);
  if (status) S.checkins.push({ habit_id: h.id, check_date: d, status, value: status === "done" && value != null ? +value : null });
  const box = $(".gy-sheet"); if (box) S.gy.sc = [box.scrollTop, box.scrollLeft];
  render();
  const after = gyBadgeTotals(), won = GBADGE.filter((b) => after[b.k] > before[b.k]);
  if (won.length) gyCelebrate(won);
}

async function gyTap(hid, d) {
  const h = S.habits.find((x) => x.id === hid); if (!h) return;
  if (d > today()) return toast("This day unlocks at 00:00 Sri Lanka time", "error");
  const c = S.checkins.find((k) => k.habit_id === hid && k.check_date === d);
  if (h.sched_type === "interval" && !c) { const x = gyX(); if (!gyCanTick(h, d, x)) return toast("Locked until " + (x.IV[h.id]?.open || "later"), "error"); }
  if (h.kind === "value") return gyValue(h, d, c);
  gySet(h, d, c ? null : "done");
}

// Value habits (weight, waist…). Same popup style as the other forms, with a plain text box that always accepts typing.
async function gyValue(h, d, c) {
  if (!window.Swal) return noSwal();
  const base = pop("nl-form");
  const res = await Swal.fire({ ...base, customClass: { ...base.customClass, denyButton: "nl-cancel" }, title: h.name, confirmButtonText: "Save", showDenyButton: !!c, denyButtonText: "Clear",
    html: `<div class="f"><div class="full lbl">${nice(d)}</div><div class="full"><label>Value${h.unit ? " (" + esc(h.unit) + ")" : ""}</label><input id="gv" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 72.5" value="${c?.value != null ? gyNum(c.value) : ""}"></div></div>`,
    didOpen: () => { const i = $("#gv"); i.focus(); i.select(); i.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); Swal.clickConfirm(); } }; },
    preConfirm: () => { const v = $("#gv").value.trim().replace(",", "."); if (v === "" || !Number.isFinite(+v)) { Swal.showValidationMessage("Enter a number"); return false; } return +v; } });
  if (res.isConfirmed) gySet(h, d, "done", res.value);
  else if (res.isDenied) gySet(h, d, null);
}

async function exportGymXlsx() {

  const tone = (p) => (p >= 80 ? { f: "FFDCFCE7", c: "FF166534" } : p >= 50 ? { f: "FFDBEAFE", c: "FF1E40AF" } : { f: "FFFEE2E2", c: "FF991B1B" });

  $("#app").innerHTML = head + body + `<nav class="tabbar">${tabs}</nav>`;
  document.querySelectorAll("[data-nav]").forEach((b) => (b.onclick = () => go(b.dataset.nav)));
  document.querySelectorAll("[data-rg]").forEach((b) => (b.onclick = () => { S.range = b.dataset.rg; render(); }));
  $("#out").onclick = logout; $("#add").onclick = () => openForm();
  document.querySelectorAll("[data-jt]").forEach((b) => (b.onclick = () => { S.jt = b.dataset.jt; render(); }));
  document.querySelectorAll("[data-fk]").forEach((b) => (b.onclick = () => { const k = b.dataset.fk; S.jc.sel.has(k) ? S.jc.sel.delete(k) : S.jc.sel.add(k); render(); }));
  document.querySelectorAll("[data-fm]").forEach((b) => (b.onclick = () => { S.jc.mode = b.dataset.fm; render(); }));
  if ($("#jco")) $("#jco").onclick = () => { S.jc.open = !S.jc.open; render(); };
  if ($("#cp")) { $("#cp").onclick = () => { if (--S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } render(); }; $("#cn").onclick = () => { if (++S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } render(); }; }
  document.querySelectorAll("[data-day]").forEach((c) => (c.onclick = () => { S.f = { ...F0(), from: c.dataset.day, to: c.dataset.day }; S.jt = "forward"; S.jc.sel = new Set(); go("journal"); }));
  document.querySelectorAll("[data-e]").forEach((b) => (b.onclick = () => openForm(S.trades.find((t) => t.id == b.dataset.e))));
  document.querySelectorAll("[data-d]").forEach((b) => (b.onclick = async () => { if (await ask("Delete this trade?", "This can't be undone.")) { await api("/api/trades/" + b.dataset.d, "DELETE"); await load(); toast("Trade deleted"); } }));
  document.querySelectorAll("[data-ff]").forEach((el) => (el.onchange = () => { S.f[el.dataset.ff] = el.value; render(); }));
  document.querySelectorAll("[data-pp]").forEach((b) => (b.onclick = () => { [S.f.from, S.f.to] = ppRange(b.dataset.pp); render(); }));
  document.querySelectorAll("[data-rr]").forEach((b) => (b.onclick = () => { const k = b.dataset.rr; S.f.rr = new Set(S.f.rr.has(k) ? [] : [k]); render(); }));
  if ($("#mfo")) $("#mfo").onclick = () => { S.mf = !S.mf; render(); };
  if ($("#clearF")) $("#clearF").onclick = () => { S.f = F0(); S.jc.sel = new Set(); render(); };
  if ($("#exportJ")) $("#exportJ").onclick = () => exportJournalXlsx(list, st);
  if (S.view === "gym") gyBind();
}

// Day rollover: when the date changes in Sri Lanka (00:00), tomorrow's boxes unlock even if the page stays open
let _day = today();
const dayCheck = () => { const t = today(); if (t === _day || document.querySelector(".swal2-container")) return; _day = t; if (S.token) render(); };
setInterval(dayCheck, 15000); document.addEventListener("visibilitychange", () => { if (!document.hidden) dayCheck(); }); addEventListener("focus", dayCheck);

S.token ? load().catch(authView) : authView();
</script>
</body>
